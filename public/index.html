<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Transmissor</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main id="entrada" class="entrada">
  <form id="form-entrar" class="cartao">
    <h1>Transmissor</h1>
    <p class="sub">Uma chamada, uma tela compartilhada. Nada é gravado.</p>

    <label for="nome">Seu nome</label>
    <input id="nome" name="nome" maxlength="24" autocomplete="nickname" placeholder="como os outros vão te ver">

    <button type="submit" id="entrar">Entrar na chamada</button>
    <p id="aviso-entrada" class="aviso" hidden></p>
  </form>
</main>

<main id="sala-view" class="sala" hidden>
  <header class="topo">
    <strong class="titulo">Transmissor</strong>
    <div class="acoes-topo">
      <span class="dica">clique para ampliar · botão direito para o volume</span>
      <span id="contagem" class="contagem"></span>
      <button id="copiar" class="fantasma">copiar link</button>
    </div>
  </header>

  <section id="palco" class="palco"></section>

  <footer class="barra">
    <button id="btn-tela" class="acao">Compartilhar tela</button>
    <button id="btn-mic" class="acao">Ligar microfone</button>
    <button id="btn-sair" class="acao perigo">Sair</button>
  </footer>

  <div id="menu" class="menu" hidden></div>
  <button id="ativar-som" class="ativar-som" hidden>🔇 Clique para ativar o som</button>
  <p id="aviso-sala" class="aviso flutuante" hidden></p>
</main>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
